([1,"\u003ch2 class=\"game-description__title\"\u003eTennis Physics\u003c/h2\u003e\n\n\u003cp class=\"game-description__paragraph\"\u003eTennis Physics is a fun, arcade-style puppet sports game featuring retro-pixel graphics and chaotic, physics-driven gameplay. Much like other games in the \"Physics\" series, it simplifies the sport of tennis into a one-button challenge where unpredictable movement and timing are key to victory.\u003c/p\u003e\n\n\u003ch2 class=\"game-description__section-title\"\u003eHow to Play\u003c/h2\u003e\n\n\u003cp class=\"game-description__paragraph\"\u003eThe game is designed around a simple one-button control scheme, making it accessible yet challenging due to the wobbly nature of the characters. You can play solo against the CPU or compete head-to-head with a friend in local multiplayer mode.\u003c/p\u003e\n\n\u003cp class=\"game-description__paragraph\"\u003e\u003cstrong\u003eSetup\u003c/strong\u003e\u003c/p\u003e\n\n\u003cul class=\"game-description__list\"\u003e\n\u003cli\u003e\u003cstrong\u003eTeams:\u003c/strong\u003e Each side controls two puppet-like tennis players.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cul class=\"game-description__list\"\u003e\n\u003cli\u003e\u003cstrong\u003eObjective:\u003c/strong\u003e Be the first to reach a score of 5 points to win the match.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cul class=\"game-description__list\"\u003e\n\u003cli\u003e\u003cstrong\u003eGameplay:\u003c/strong\u003e Players jump and swing their rackets simultaneously with a single button press. The goal is to hit the ball over the net and into the opponent's court while managing the wobbly physics of your team.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp class=\"game-description__paragraph\"\u003e\u003cstrong\u003eMechanics\u003c/strong\u003e\u003c/p\u003e\n\n\u003cul class=\"game-description__list\"\u003e\n\u003cli\u003e\u003cstrong\u003eOne-Button Control:\u003c/strong\u003e A single key press triggers a jump and a swing.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cul class=\"game-description__list\"\u003e\n\u003cli\u003e\u003cstrong\u003eChaotic Physics:\u003c/strong\u003e The players move in unpredictable ways, often leading to funny moments and unexpected shots.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cul class=\"game-description__list\"\u003e\n\u003cli\u003e\u003cstrong\u003eLocal Multiplayer:\u003c/strong\u003e Supports two players on the same keyboard or device.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2 class=\"game-description__section-title\"\u003eFeatures\u003c/h2\u003e\n\n\u003cul class=\"game-description__list\"\u003e\n\u003cli\u003eSimple and addictive one-button gameplay.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cul class=\"game-description__list\"\u003e\n\u003cli\u003eRetro-pixel art style.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cul class=\"game-description__list\"\u003e\n\u003cli\u003eFun and unpredictable physics-based character movement.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cul class=\"game-description__list\"\u003e\n\u003cli\u003eLocal 2-player support.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cul class=\"game-description__list\"\u003e\n\u003cli\u003eFast-paced matches that are perfect for quick play sessions.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2 class=\"game-description__section-title\"\u003eRelease Info\u003c/h2\u003e\n\n\u003cp class=\"game-description__paragraph\"\u003eTennis Physics is part of the popular \"Physics\" sports genre often found on browser-based gaming platforms. It follows the design philosophy of games like *Soccer Physics* and *Basket Random*, focusing on comedic, physics-heavy interactions.\u003c/p\u003e\n\n\u003ch2 class=\"game-description__section-title\"\u003ePlatforms\u003c/h2\u003e\n\n\u003cul class=\"game-description__list\"\u003e\n\u003cli\u003e\u003cstrong\u003eWeb Browser:\u003c/strong\u003e Playable on desktop and mobile browsers via HTML5.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cul class=\"game-description__list\"\u003e\n\u003cli\u003e\u0
